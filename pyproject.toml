[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mview"
version = "0.1.0"
description = "Fast, fully offline GitHub-style Markdown preview CLI with live reload"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Developer" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "markdown-it-py>=3.0.0",
    "linkify-it-py>=2.0.0",
    "mdit-py-plugins>=0.4.0",
    "watchdog>=4.0.0",
    "emoji>=2.0.0",
]

[project.scripts]
mview = "mview.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mview*"]

[tool.setuptools.package-data]
mview = ["assets/*"]
